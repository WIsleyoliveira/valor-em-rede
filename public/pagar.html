<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PIX — Valor em Rede</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f0fdf4;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .card {
      background: #fff;
      border-radius: 20px;
      padding: 2.5rem 1.5rem;
      max-width: 360px;
      width: 100%;
      box-shadow: 0 8px 32px rgba(0,0,0,0.10);
      text-align: center;
    }

    /* Tela formulário */
    #tela-form { display: none; flex-direction: column; gap: 1.25rem; }

    .form-logo {
      font-size: 2rem;
      margin-bottom: 0.25rem;
    }
    .form-titulo { font-size: 1.2rem; font-weight: 800; color: #065f46; }
    .form-sub    { font-size: 0.85rem; color: #6b7280; }

    .form-group { display: flex; flex-direction: column; gap: 0.4rem; text-align: left; }
    .form-label { font-size: 0.8rem; font-weight: 600; color: #374151; }
    .form-input {
      border: 1.5px solid #d1fae5;
      border-radius: 10px;
      padding: 0.75rem 1rem;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.15s;
    }
    .form-input:focus { border-color: #059669; }

    .btn-pagar {
      background: #059669;
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 0.9rem;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-pagar:hover { background: #047857; }
    .btn-pagar:disabled { background: #a7f3d0; cursor: not-allowed; }

    /* Tela processando */
    #tela-processando { display: none; flex-direction: column; align-items: center; gap: 1rem; }

    .spinner-ring {
      width: 72px; height: 72px;
      border: 5px solid #bbf7d0;
      border-top-color: #059669;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    .proc-titulo { font-size: 1.1rem; font-weight: 700; color: #065f46; }
    .proc-sub    { font-size: 0.85rem; color: #6b7280; line-height: 1.8; }

    .dots span {
      display: inline-block;
      animation: bounce 1.2s ease-in-out infinite;
      font-size: 1.4rem;
      color: #059669;
    }
    .dots span:nth-child(2) { animation-delay: 0.2s; }
    .dots span:nth-child(3) { animation-delay: 0.4s; }

    /* Tela sucesso */
    #tela-sucesso { display: none; flex-direction: column; align-items: center; gap: 1rem; }

    .check-wrap {
      width: 80px; height: 80px;
      background: #059669;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .check-wrap svg { width: 40px; height: 40px; }
    .check-wrap svg path {
      stroke: #fff;
      stroke-width: 3;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      stroke-dasharray: 60;
      stroke-dashoffset: 60;
      animation: draw 0.5s ease 0.3s forwards;
    }

    .suc-titulo { font-size: 1.3rem; font-weight: 800; color: #065f46; }
    .suc-valor  { font-size: 2rem; font-weight: 800; color: #059669; }
    .suc-nome   { font-size: 0.875rem; color: #6b7280; }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: #dcfce7;
      color: #065f46;
      font-size: 0.78rem;
      font-weight: 700;
      padding: 0.35rem 0.9rem;
      border-radius: 20px;
    }

    .suc-msg {
      font-size: 0.8rem;
      color: #9ca3af;
      line-height: 1.6;
    }

    @keyframes spin   { to { transform: rotate(360deg); } }
    @keyframes bounce { 0%,80%,100% { transform: translateY(0); } 40% { transform: translateY(-8px); } }
    @keyframes pop    { from { transform: scale(0); } to { transform: scale(1); } }
    @keyframes draw   { to { stroke-dashoffset: 0; } }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .fade-in { animation: fadeIn 0.4s ease forwards; }
  </style>
</head>
<body>
<div class="card">

  <!-- Formulário (sem parâmetros na URL) -->
  <div id="tela-form">
    <div class="form-logo">⚡</div>
    <div class="form-titulo">Pagar via PIX</div>
    <div class="form-sub">Valor em Rede — Associação Comunitária</div>

    <div class="form-group">
      <label class="form-label" for="input-nome">Seu nome</label>
      <input id="input-nome" class="form-input" type="text" placeholder="Nome completo" autocomplete="name" />
    </div>

    <div class="form-group">
      <label class="form-label" for="input-valor">Valor (R$)</label>
      <input id="input-valor" class="form-input" type="number" min="1" step="0.01" placeholder="0,00" inputmode="decimal" />
    </div>

    <button class="btn-pagar" id="btn-pagar" onclick="confirmarManual()">Confirmar pagamento</button>
  </div>

  <!-- Processando -->
  <div id="tela-processando">
    <div class="spinner-ring"></div>
    <div class="proc-titulo">Processando PIX</div>
    <div class="proc-sub">
      Confirmando pagamento
      <br />
      <div class="dots"><span>.</span><span>.</span><span>.</span></div>
    </div>
  </div>

  <!-- Sucesso -->
  <div id="tela-sucesso">
    <div class="check-wrap">
      <svg viewBox="0 0 52 52">
        <path d="M14 27 L22 35 L38 18" />
      </svg>
    </div>
    <div class="suc-titulo">Pagamento confirmado!</div>
    <div class="suc-valor" id="exibe-valor">R$ 0,00</div>
    <div class="suc-nome" id="exibe-nome"></div>
    <div class="badge">⚡ PIX processado com sucesso</div>
    <div class="suc-msg">
      Pode fechar esta tela.<br />
      O comprovante já foi gerado no sistema.
    </div>
  </div>

</div>
<script>
  const params = new URLSearchParams(window.location.search);
  const id    = params.get('id')    || '';
  const valor = parseFloat(params.get('valor') || '0');
  const nome  = decodeURIComponent(params.get('nome') || '');

  function mostrarSucesso(v, n, pid) {
    document.getElementById('exibe-valor').textContent =
      v.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    document.getElementById('exibe-nome').textContent = n;

    document.getElementById('tela-processando').style.display = 'none';
    const s = document.getElementById('tela-sucesso');
    s.style.display = 'flex';
    s.classList.add('fade-in');
  }

  // Registra confirmação no servidor para que o app do operador detecte via polling
  async function registrarConfirmacao(pid, v, n) {
    try {
      await fetch('/api/pix-confirm', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: pid, valor: v, nome: n }),
      });
    } catch {
      // falha silenciosa — o operador pode confirmar manualmente
    }
  }

  // Veio com parâmetros (QR Code dinâmico gerado pelo app) — fluxo automático
  if (id && valor > 0) {
    document.getElementById('tela-processando').style.display = 'flex';
    registrarConfirmacao(id, valor, nome || 'Associado').then(() => {
      mostrarSucesso(valor, nome || 'Associado', id);
    });

  // Sem parâmetros (QR Code físico) — mostra formulário
  } else {
    document.getElementById('tela-form').style.display = 'flex';

    function validarForm() {
      const v = parseFloat(document.getElementById('input-valor').value);
      const n = document.getElementById('input-nome').value.trim();
      document.getElementById('btn-pagar').disabled = !(v > 0 && n.length > 1);
    }

    document.getElementById('input-valor').addEventListener('input', validarForm);
    document.getElementById('input-nome').addEventListener('input', validarForm);
    document.getElementById('btn-pagar').disabled = true;
  }

  async function confirmarManual() {
    const n = document.getElementById('input-nome').value.trim();
    const v = parseFloat(document.getElementById('input-valor').value);
    if (!n || !(v > 0)) return;

    document.getElementById('tela-form').style.display = 'none';
    document.getElementById('tela-processando').style.display = 'flex';

    // Gera um ID local para este pagamento manual
    const pid = 'pix_qr_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6);

    // Registra no servidor para o app do operador detectar
    await registrarConfirmacao(pid, v, n);

    mostrarSucesso(v, n, pid);
  }
</script>
</body>
</html>
